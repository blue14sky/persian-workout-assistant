name: Deploy Fito

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fito-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to wbg-test
    runs-on: [self-hosted, wbg-test]
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_PATH="/opt/apps/azin-workout"
          mkdir -p "$DEPLOY_PATH"
          # Deploy source files, not Git metadata. Preserve server-only .env.
          tar -C "$GITHUB_WORKSPACE" --exclude="./.git" --exclude="./.env" -cf - . | tar -C "$DEPLOY_PATH" -xf -
          cd "$DEPLOY_PATH"

          # Create persistent secrets only on the first deployment.
          # Existing .env is never overwritten by CI.
          if [ ! -f .env ]; then
            command -v openssl >/dev/null 2>&1 || {
              echo "openssl is required to create the initial .env file."
              exit 1
            }
            DJANGO_SECRET="$(openssl rand -hex 48)"
            POSTGRES_PASSWORD="$(openssl rand -hex 32)"
            umask 077
            cat > .env <<EOF
          DJANGO_SECRET_KEY=$DJANGO_SECRET
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=
          POSTGRES_DB=fito
          POSTGRES_USER=fito
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EOF
          fi

          docker network inspect public_proxy >/dev/null
          docker compose config --quiet
          docker compose up -d --build --remove-orphans

          # Application must not publish the internal port on the host.
          container_id="$(docker compose ps -q web)"
          test -n "$container_id"
          test -z "$(docker port "$container_id" 8000/tcp)"
          ready=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T web python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).status == 200" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose logs --tail=80 web
            exit 1
          fi
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py test landing --noinput
          if docker inspect edge_nginx >/dev/null 2>&1; then
            docker exec edge_nginx wget -qO- --header="Host: workout.webigram.ir" http://workout-fito:8000/health/
          fi
